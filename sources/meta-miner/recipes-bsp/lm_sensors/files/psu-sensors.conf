# PSU PMBus Driver Sensor Configuration
# This configuration file maps the PSU driver's sysfs attributes
# to the sensors command output format.
#
# The driver provides both standard hwmon power values (in microwatts)
# and custom milliwatt attributes for compatibility.

# PSU PMBus Chip Configuration
chip "psu_pmbus-*"

    # Voltages (standard hwmon, values in mV)
    label in1 "PSU Input Voltage"
    label in2 "PSU Output Voltage"

    # Currents (standard hwmon, values in mA)
    label curr1 "PSU Input Current"
    label curr2 "PSU Output Current"

    # Power values using custom milliwatt attributes
    # These provide accurate readings without overflow on 32-bit systems
    label power1 "PSU Input Power"
    label power2 "PSU Output Power"

    # Use the custom milliwatt sysfs attributes instead of standard hwmon
    # This avoids integer overflow on 32-bit systems with high-power PSUs
    ignore power1
    ignore power2

    # Custom power readings in milliwatts
    # These are exposed through the driver's custom sysfs attributes
    # and need to be manually computed for display
    compute power1_input_mw @/1000, @*1000
    compute power2_input_mw @/1000, @*1000

    # Temperature sensors
    label temp1 "PSU Ambient Temp"
    label temp2 "PSU Hotspot Temp"
    label temp3 "PSU Average Temp"

    # Fan sensors
    label fan1 "PSU Fan 1"
    label fan2 "PSU Fan 2"
    label fan3 "PSU Fan 3"
    label fan4 "PSU Fan 4"

    # Alarm thresholds (optional, adjust based on PSU specs)
    set in1_min     180000    # 180V minimum input
    set in1_max     264000    # 264V maximum input
    set in2_min     11500     # 11.5V minimum output
    set in2_max     12500     # 12.5V maximum output
    set curr2_max   333000    # 333A maximum output current (4kW @ 12V)
    set temp1_max   45000     # 45°C ambient max
    set temp2_max   85000     # 85°C hotspot max
    set temp3_max   70000     # 70°C average max

# Note: The power readings will appear as follows in sensors output:
# - power1_input_mw: Input power in Watts (converted from mW)
# - power2_input_mw: Output power in Watts (converted from mW)
#
# On 32-bit systems, if power exceeds ~2147W, the standard hwmon
# power1_input and power2_input will show as "N/A" or error,
# while the custom _mw attributes will continue to work correctly.