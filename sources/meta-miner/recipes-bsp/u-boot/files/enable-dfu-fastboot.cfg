CONFIG_USB_GADGET=y
CONFIG_USB_DWC2=y
CONFIG_USB_GADGET_DWC2_OTG=y
CONFIG_USB_GADGET_DUALSPEED=y
CONFIG_USB_GADGET_VBUS_DRAW=500

CONFIG_MMC_HS200_SUPPORT=y
CONFIG_MMC_HS400_SUPPORT=y

CONFIG_CMD_DFU=y
CONFIG_DFU=y
CONFIG_DFU_OVER_USB=y
CONFIG_DFU_TIMEOUT=y
CONFIG_DFU_MMC=y
# CONFIG_DFU_NAND is not set
CONFIG_DFU_RAM=y
# CONFIG_DFU_SF is not set
CONFIG_DFU_MTD=y
CONFIG_DFU_VIRT=y
CONFIG_SET_DFU_ALT_INFO=y

CONFIG_SYS_DFU_DATA_BUF_SIZE=0x2000000
CONFIG_SYS_DFU_MAX_FILE_SIZE=0x2000000
CONFIG_SYS_MALLOC_LEN=0x8000000
CONFIG_SYS_MALLOC_F_LEN=0x200000

CONFIG_FASTBOOT=y
CONFIG_FASTBOOT_FLASH_MMC_DEV=1
CONFIG_FASTBOOT_MMC_BOOT_SUPPORT=y
CONFIG_FASTBOOT_MMC_BOOT1_NAME="mmc1boot0"
CONFIG_FASTBOOT_MMC_BOOT2_NAME="mmc1boot1"
CONFIG_FASTBOOT_MMC_USER_SUPPORT=y
CONFIG_FASTBOOT_MMC_USER_NAME="mmc1"

CONFIG_USB_FUNCTION_FASTBOOT=y
CONFIG_UDP_FUNCTION_FASTBOOT=y
CONFIG_FASTBOOT_FLASH=y
CONFIG_FASTBOOT_CMD_OEM_FORMAT=y
CONFIG_FASTBOOT_CMD_OEM_PARTCONF=y
# CONFIG_USB_HOST is not set
# CONFIG_USB_FUNCTION_MASS_STORAGE is not set
CONFIG_FASTBOOT_USB_DEV=0
CONFIG_PHY_GIGE=y
CONFIG_NET_RANDOM_ETHADDR=y
