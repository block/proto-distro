# AVB Public Key Configuration for DM-Verity
# This configuration adds the dm-verity public key to U-Boot for AVB verification

# AVB tooling for DM Verity enablement with vbmeta
CONFIG_LIBAVB=y
CONFIG_AVB_VERIFY=y
CONFIG_CMD_AVB=y
CONFIG_RSA=y
CONFIG_SHA256=y

CONFIG_AVB_PUBKEY_FILE="${DM_VERITY_SIGN_KEYDIR}/dm-verity-rootfs-signing-key.avbpubkey"
