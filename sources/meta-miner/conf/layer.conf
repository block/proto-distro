# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, in: ${LAYERDIR}/recipes-*/
#
# Add them to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "miner"
BBFILE_PATTERN_miner = "^${LAYERDIR}/"
BBFILE_PRIORITY_miner = "6"

LAYERDEPENDS_miner = "core"
LAYERSERIES_COMPAT_miner = "kirkstone langdale"

# Prevent memfaultd from being added to all images 
# that use packagegroup-core-boot by default
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:remove = "memfaultd"
