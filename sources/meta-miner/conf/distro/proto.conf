DISTRO = "proto"
DISTRO_NAME = "Proto Embedded Linux Distribution"
MAINTAINER = "Proto Embedded SW Team <btcm-sw-team@squareup.com>"

DISTRO_FEATURES = "acl ipv4 xattr ldconfig usbgadget usbhost systemd-resolved overlayfs"
DISTRO_FEATURES_BACKFILL_CONSIDERED = "pulseaudio"
DISTRO_EXTRA_RDEPENDS += "packagegroup-core-boot"
DISTRO_EXTRA_RRECOMMENDS = ""

BUILD_DATETIME_UTC = "${@d.getVar('BUILD_DATETIME')}"
DISTRO_BASE_VERSION = "${DISTRO_VERSION}"

# Defining image name explicitly
IMAGE_NAME = "${IMAGE_BASENAME}-${MACHINE}-${DISTRO_VERSION}"

# Add overhead factor for image size, at least 1.1x seems to be needed for ext4 generation to work
IMAGE_OVERHEAD_FACTOR = "1.25"

SDK_NAME = "${DISTRO}-${TCLIBC}-${SDKMACHINE}-${IMAGE_BASENAME}-${TUNE_PKGARCH}-${MACHINE}"
SDKPATHINSTALL = "/opt/${DISTRO}/${SDK_VERSION}"

# poky
require conf/distro/include/no-static-libs.inc
require conf/distro/include/security_flags.inc

INIT_MANAGER = "systemd"
VIRTUAL-RUNTIME_initscripts = ""

PACKAGE_CLASSES = "package_ipk"

IMAGE_LINGUAS = "en-us"

# Rust version configuration
require conf/distro/include/rust_versions.inc
RUST_VERSION = "1.78.0"

# Enable vulnerability checking
# TODO: re-enable this at a later time
# INHERIT += "cve-check"
# include conf/distro/include/cve-extra-exclusions.inc
# include conf/distro/include/proto-cve-exclusions.inc
# CVE_SOCKET_TIMEOUT = "180"

# Prevent an error since Intel repo is now read-only and we cannot fetch
# We don't use bmap-tools anyway during wic file construction
WKS_FILE_DEPENDS:remove = "bmap-tools-native"

### Memfault Configuration ###
LICENSE_FLAGS_ACCEPTED:append = " commercial_memfaultd"

# Base URL as used in swupdate and memfaultd for reporting to Memfault
MEMFAULT_BASE_URL := "https://device.memfault.com"

# Device serial to report to Memfault
MEMFAULT_DEVICE_ID:pn-memfault-device-info := "none"

# Hardware version to report to Memfault
MEMFAULT_HARDWARE_VERSION := "${@d.getVar('MACHINE')}"
MEMFAULT_SOFTWARE_VERSION := "${DISTRO_VERSION}"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-image"
KERNEL_FEATURES:append = " cgl/features/pstore/pstore.scc cfg/debug/misc/debug-panic-oops.scc"
