# Minimal rsyslog configuration for miner firmware
# Service-specific logs are handled in /etc/rsyslog.d/*.conf

# Load input modules
$ModLoad imuxsock # local system logging
$ModLoad imklog   # kernel logging

# Rate limiting for imuxsock: 2000 messages per 60 seconds (matching journald config)
$SystemLogRateLimitInterval 60
$SystemLogRateLimitBurst 2000

# Set default permissions
$FileOwner root
$FileGroup adm
$FileCreateMode 0640
$DirCreateMode 0755
$Umask 0022

# Include service-specific configs FIRST (allows "& stop" to prevent duplicates)
$IncludeConfig /etc/rsyslog.d/*.conf

# Emergencies are sent to everybody logged in
*.emerg                         :omusrmsg:*
