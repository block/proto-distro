# Shared NATS authorization for local services, browser telemetry, and monitoring.

accounts {
    APP {
        jetstream: enabled
        users: [
            {
                user: local_services
                password: local
                allowed_connection_types: ["STANDARD"]
            }
            {
                user: protoos_web_ro
                password: web
                allowed_connection_types: ["WEBSOCKET"]
                permissions: {
                    # Read-only: never allowed to publish; may subscribe to any subject.
                    publish: {
                        deny: [">"]
                    }
                    subscribe: {
                        allow: [">"]
                    }
                }
            }
        ]
    }

    SYS {
        users: [
            {
                user: system_monitor
                password: monitor
                allowed_connection_types: ["STANDARD"]
                permissions: {
                    publish: {
                        allow: [
                            "$SYS.REQ.SERVER.PING.STATSZ"
                            "$SYS.REQ.SERVER.*.STATSZ"
                            "$SYS.REQ.SERVER.PING.JSZ"
                            "$SYS.REQ.SERVER.*.JSZ"
                        ]
                    }
                    subscribe: {
                        allow: [
                            "$SYS.SERVER.*.STATSZ"
                            "_INBOX.>"
                        ]
                    }
                }
            }
        ]
    }
}

system_account: SYS
no_auth_user: local_services
