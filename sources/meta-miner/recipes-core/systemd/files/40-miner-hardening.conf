# Mask protected kernel pointers, including for privileged readers.
kernel.kptr_restrict = 2

# Reading the kernel ring buffer requires CAP_SYSLOG (e.g. sudo dmesg).
kernel.dmesg_restrict = 1

# Disable unprivileged bpf() access until reboot; privileged BPF still works.
kernel.unprivileged_bpf_disabled = 1

# Harden unprivileged BPF JIT programs when JIT is enabled.
# This does not enable JIT or harden privileged BPF programs.
net.core.bpf_jit_harden = 1

# Include the heap in address-space randomization.
kernel.randomize_va_space = 2

# Module loading remains unchanged pending boot-order and recovery validation.
