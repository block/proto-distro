[Journal]
Storage=volatile
# Shared RAM budget for the journal, including nginx errors.
RuntimeMaxUse=16M
RuntimeKeepFree=20M
RuntimeMaxFileSize=2M

ForwardToSyslog=yes

# Rate limiting: protects against runaway logging filling RAM/disk
# Based on typical mcdd logging rates:
# - Message size: ~200 bytes average
# - Normal operation: 200-300 messages/minute (~50-60 KB/min)
# - Debug mode: ~1,000 messages/minute (~200 KB/min)
#
# Rate limit: Allows burst of 2,000 messages per 60-second window
# - Normal operation: 200-300 msg/min → No drops (within limit)
# - Debug mode: 1,000 msg/min → No drops (within limit)
# - Runaway protection: Max 2,000 msg/min × 60 min × 200 bytes = ~24 MB/hour
RateLimitIntervalSec=60s
RateLimitBurst=2000
