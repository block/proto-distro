# Base SWUpdate configuration.
#
# proto-swupdate consumes this file directly for local image installation.
# memfaultd also uses it as a base, adding device identity and
# Suricatta/Memfault remote-OTA settings to a generated configuration.

globals :
{
	verbose = true;
	loglevel = 6;
	syslog = true;
	workdir = "/etc/swupdate";
	ipc_path = "/tmp/swupdate.sock"
};

download :
{
	retries = 3;
	timeout = 1800;
};

suricatta :
{
	confirm 	= 0;
	polldelay	= 60;
	retry		= 4;
	retrywait	= 200;
	loglevel	= 10;
	userid		= 0;
	groupid		= 0;
	max_artifacts	= 1;
};
