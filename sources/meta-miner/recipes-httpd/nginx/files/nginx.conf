user www-data;
worker_processes  1;

# Journald bounds retention and forwards records to rsyslog for file archiving.
error_log syslog:server=unix:/run/systemd/journal/dev-log,facility=daemon,tag=nginx,nohostname error;
# Prevent nginx from adding an implicit error-level stderr sink beside syslog.
error_log stderr emerg;
pid        /var/run/nginx/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $status $log_failed_response {
        default 0;
        ~^[45]  1;
    }
    access_log syslog:server=unix:/run/systemd/journal/dev-log,facility=daemon,tag=nginx_access,severity=warn,nohostname combined if=$log_failed_response;

    sendfile        on;
    keepalive_timeout  65;

    client_max_body_size      512m;
    proxy_request_buffering   off;

    include /etc/nginx/conf.d/*.conf;
}
