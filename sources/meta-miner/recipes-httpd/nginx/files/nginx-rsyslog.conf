# Preserve nginx errors and failed responses forwarded by journald for shutdown archiving.
template(name="nginx_format" type="string" string="%TIMESTAMP:::date-rfc3339% %msg%\n")
if $programname == "nginx" then {
    action(type="omfile" file="/var/log/nginx/error.log" template="nginx_format" dirCreateMode="0755")
    stop
}
if $programname == "nginx_access" then {
    action(type="omfile" file="/var/log/nginx/access.log" template="nginx_format" dirCreateMode="0755")
    stop
}
