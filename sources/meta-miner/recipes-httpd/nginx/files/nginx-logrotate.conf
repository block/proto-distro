/var/log/nginx/*.log {
    # Size is checked by the existing hourly logrotate timer, not a hard cap.
    size 1M
    rotate 30
    compress
    missingok
    notifempty
    # ponytail: copytruncate can lose concurrent writes; use renamecopy plus reopen if loss is unacceptable.
    copytruncate
    olddir /data/log/nginx
    createolddir 0755 root root
    dateext
    dateformat -%Y%m%d-%H%M%S-rotated
}
