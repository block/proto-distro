name: Docker tag and publish
description: Publish a Docker image and create a tag
inputs:
  dockerfile:
    description: The path to the Dockerfile
    required: true
  context:
    description: The Docker build context path
    required: false
    default: .
  platforms:
    description: The platforms to build for
    required: false
    default: linux/amd64,linux/arm64
  initial_version:
    description: The initial version to use if no tags are found
    required: false
    default: 1.0.0
  image_name:
    description: The Docker image name (e.g. "distro-builder")
    required: true
  repository_owner:
    description: The owner of the repository
    required: false
    default: ${{ github.repository_owner }}
  github_token:
    description: The GitHub token
    required: true

runs:
  using: "composite"
  steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.1.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3.4.0
      with:
        install: true

    - name: Get latest tag
      id: get_tag
      shell: bash
      env:
        LATEST_TAG: ""
        NEW_VERSION: ""
        NEW_TAG: ""
      run: |
        name="${{ inputs.image_name }}"
        # Extract the tag name from the ref if it matches the pattern
        if [[ "${{ github.ref }}" == refs/tags/${name}-* ]]; then
          version="${{ github.ref }}"
          version="${version#refs/tags/${name}-}"
          echo "NEW_VERSION=$version" >> $GITHUB_ENV
          echo "NEW_TAG=${name}-$version" >> $GITHUB_ENV
          tag="$version"
        else
          # Get the latest tag that matches the pattern
          tag=$(git tag -l "${name}-*" | sort -V | tail -n 1)
          tag="${tag#${name}-}"
          # Fallback to the initial version if no matching tags found
          if [ -z "$tag" ]; then
            echo "NEW_VERSION=${{ inputs.initial_version }}" >> $GITHUB_ENV
            echo "NEW_TAG=${name}-${{ inputs.initial_version }}" >> $GITHUB_ENV
          fi
        fi
        echo "LATEST_TAG=$tag" >> $GITHUB_ENV

    - name: Calculate new version
      id: new_version
      if: env.NEW_VERSION == '' && env.NEW_TAG == ''
      shell: bash
      run: |
        IFS='.' read -r -a version_parts <<< "${{ env.LATEST_TAG }}"
        major=${version_parts[0]}
        minor=${version_parts[1]}
        patch=${version_parts[2]}
        new_patch=$((patch + 1))
        version="$major.$minor.$new_patch"
        echo "NEW_VERSION=$version" >> $GITHUB_ENV
        echo "NEW_TAG=${{ inputs.image_name }}-$version" >> $GITHUB_ENV

    - name: Build and push
      uses: docker/build-push-action@v6.3.0
      with:
        context: ${{ inputs.context }}
        # PR builds: use single-platform + --load so buildx exports an image and avoids no-output warnings.
        platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || inputs.platforms }}
        load: ${{ github.event_name == 'pull_request' }}
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: |
          ghcr.io/${{ inputs.repository_owner }}/${{ inputs.image_name }}:latest
          ghcr.io/${{ inputs.repository_owner }}/${{ inputs.image_name }}:${{ env.NEW_VERSION }}
        file: "${{ inputs.dockerfile }}"
        cache-from: type=gha
        cache-to: type=gha,mode=max
        github-token: ${{ inputs.github_token }}

    - name: Create new tag
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        git tag ${{ env.NEW_TAG }}
        git remote set-url origin https://${{ github.actor }}:${{ env.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        git push origin ${{ env.NEW_TAG }}
