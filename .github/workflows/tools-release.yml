name: Publish Tools

on:
  push:
    tags: ["tools-*"]
  pull_request:
    paths:
      - ".github/workflows/tools-release.yml"
      - "tools/**"
      - "go.work"
      - "go.work.sum"
      - "distro.yaml"
      - "LICENSE"

permissions:
  contents: read

jobs:
  build:
    name: Build tools (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: tools/**/go.sum
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libusb-1.0-0-dev pkg-config
      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install libusb pkg-config
      - name: Build and bundle native tools
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version=snapshot
          if [[ "$GITHUB_REF" == refs/tags/tools-* ]]; then
            version="${GITHUB_REF_NAME#tools-}"
          fi
          date="$(git show -s --format=%cI HEAD)"
          stage="$RUNNER_TEMP/distro-tools"
          mkdir -p "$stage" dist
          distro_flags="-s -w -X proto-distro/tools/distro/internal/version.Version=$version -X proto-distro/tools/distro/internal/version.Commit=$GITHUB_SHA -X proto-distro/tools/distro/internal/version.Date=$date"
          CGO_ENABLED=0 go build -trimpath -ldflags="$distro_flags" -o "$stage/distro" ./tools/distro/cmd/distro
          CGO_ENABLED=0 go build -trimpath -ldflags="$distro_flags" -o "$stage/opkg-inject" ./tools/distro/cmd/opkg-inject
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w -X proto-distro/tools/cb_st_flasher/internal/version.Version=$version -X proto-distro/tools/cb_st_flasher/internal/version.Commit=$GITHUB_SHA -X proto-distro/tools/cb_st_flasher/internal/version.Date=$date" -o "$stage/cb_st_flasher" ./tools/cb_st_flasher/cmd/cb_st_flasher
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X proto-distro/tools/go_fastboot.Version=$version -X proto-distro/tools/go_fastboot.GitCommit=$GITHUB_SHA" -o "$stage/go_fastboot" ./tools/go_fastboot/cmd/go_fastboot
          cp distro.yaml LICENSE tools/THIRD_PARTY_NOTICES "$stage/"
          COPYFILE_DISABLE=1 tar -C "$stage" -czf "dist/distro-tools-${TARGET_OS}-${TARGET_ARCH}.tar.gz" distro opkg-inject cb_st_flasher go_fastboot distro.yaml LICENSE THIRD_PARTY_NOTICES
      - uses: actions/upload-artifact@v4
        with:
          name: tools-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/tools-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tools-*
          merge-multiple: true
          path: dist
      - name: Publish tools release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Tools ${GITHUB_REF_NAME#tools-}" --generate-notes
