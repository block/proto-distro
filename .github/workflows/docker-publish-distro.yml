name: Publish Docker Containers (Distro)

on:
  pull_request:
    paths:
      - ".github/workflows/docker-publish-distro.yml"
      - "docker/**"
      - "python/**"
      - "tools/distro/**"
      - "LICENSE"
      - "tools/THIRD_PARTY_NOTICES"
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-publish-distro.yml"
      - "docker/**"
      - "python/**"
      - "tools/distro/**"
      - "LICENSE"
      - "tools/THIRD_PARTY_NOTICES"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [builder, injector]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3.4.0
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/proto-distro-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/login-action@v4.1.0
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.3.0
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=distro-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=distro-${{ matrix.image }}
