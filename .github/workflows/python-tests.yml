name: Test Python

on:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-tests.yml"
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

jobs:
  test-python:
    name: Test FSBL (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"
      - name: Test Python suites
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv run --managed-python --python 3.12 --locked --project python --extra dev pytest python/fsbl/tests
